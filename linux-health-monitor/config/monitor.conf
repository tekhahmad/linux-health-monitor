# health-monitor configuration (sourced by bash; keep root-owned, mode 0644 or stricter)
CPU_WARN=70;  CPU_CRIT=90
MEM_WARN=80;  MEM_CRIT=92
DISK_WARN=80; DISK_CRIT=90

SERVICES="ssh cron"
PORTS="127.0.0.1:22"
CERT_HOSTS=""                       # e.g. "intranet.example.com:443"
AUTH_LOG="/var/log/auth.log"

# Alerting: put a Slack/Teams/Discord incoming-webhook URL here (never commit a real one)
ALERT_WEBHOOK_URL=""
ALERT_MIN_LEVEL="WARN"
ALERT_REPEAT_MINUTES=60
